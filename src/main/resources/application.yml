spring:
  application:
    name: billar-api
  datasource:
    # Por defecto usa H2 (archivo local) para desarrollo. En producción usa el perfil "prod" (PostgreSQL).
    url: ${DB_URL:jdbc:h2:file:./data/billar;AUTO_SERVER=TRUE}
    username: ${DB_USER:sa}
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: ${DDL_AUTO:update}
  jackson:
    default-property-inclusion: non_null

server:
  port: ${PORT:8080}

billar:
  jwt-secret: ${JWT_SECRET:secreto-de-desarrollo-cambialo-en-produccion-32-caracteres-minimo}
  jwt-hours: 12
  cors-origins: ${CORS_ORIGINS:http://localhost:*,http://127.0.0.1:*}
  timezone: America/Bogota
  owner:
    username: ${BILLAR_OWNER_USER:admin}
    password: ${BILLAR_OWNER_PASSWORD:Admin12345}
