spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 5
      minimum-idle: 0
      idle-timeout: 120000
      max-lifetime: 240000
      connection-timeout: 40000
  jpa:
    hibernate:
      ddl-auto: update

billar:
  jwt-secret: ${JWT_SECRET}
  cors-origins: ${CORS_ORIGINS:https://localhost}
  owner:
    username: ${BILLAR_OWNER_USER}
    password: ${BILLAR_OWNER_PASSWORD}